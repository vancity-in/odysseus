name: Sync upstream dev and deploy Railway

on:
  workflow_dispatch:

concurrency:
  group: sync-upstream-railway
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Merge upstream and update Railway source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Railway deployment branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: railway
          fetch-depth: 0

      - name: Merge upstream dev and update the Railway branch
        env:
          UPSTREAM_REPOSITORY: https://github.com/odysseus-dev/odysseus.git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream dev

          upstream_sha="$(git rev-parse upstream/dev)"
          upstream_short="$(git rev-parse --short=12 upstream/dev)"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "railway already contains upstream dev at $upstream_short" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git merge --no-ff --no-edit upstream/dev

          python3 -m json.tool railway.json >/dev/null
          test -f Dockerfile
          git diff --check HEAD^ HEAD

          git push origin HEAD:railway

          echo "Updated railway to include upstream dev at $upstream_short." >> "$GITHUB_STEP_SUMMARY"
          echo "Railway's GitHub source deployment should now be triggered." >> "$GITHUB_STEP_SUMMARY"
